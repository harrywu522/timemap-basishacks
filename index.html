<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TimeMap: Global Evolution</title>
    <!-- Link to our external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>TimeMap</h1>
        <h2 id="location-name">Loading City...</h2>
    </div>

    <div class="main-display">
        <!-- Left Button -->
        <button class="nav-button" onclick="moveBack()">⬅</button>

        <!-- The Map Viewing Area -->
        <div class="map-container">
            <div id="past-layer" class="layer"></div>
            <div id="modern-layer" class="layer"></div>
        </div>

        <!-- Right Button -->
        <button class="nav-button" onclick="moveForward()">➡</button>
    </div>

    <div class="ui-controls">
        <!-- Slider to reveal the hidden layer -->
        <input type="range" id="slider" min="0" max="100" value="50" oninput="revealLayer()">
        
        <div class="labels">
            <span id="past-year">PAST</span>
            <span>PRESENT (2026)</span>
        </div>
    </div>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
